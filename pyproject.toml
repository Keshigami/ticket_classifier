[project]
name = "ticket-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
